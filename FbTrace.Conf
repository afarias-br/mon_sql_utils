<database>
	enabled true
	#include_filter 
	#exclude_filter 
	log_connections true
	log_transactions true
	log_statement_prepare true
	log_statement_free false
	log_statement_start true
	log_statement_finish true
	log_procedure_start true
	log_procedure_finish true
	log_trigger_start true
	log_trigger_finish true
	log_context true
	log_errors true
	log_warnings false
	log_initfini true
	log_sweep false
	print_plan false
	print_perf false
	log_blr_requests false
	print_blr false
	log_dyn_requests false
	print_dyn false
	time_threshold 100
	max_sql_length 3000
	max_blr_length 500
	max_dyn_length 500
	max_arg_length 800
	max_arg_count 300
</database>

fbtracemgr -se localhost:service_mgr -start -conf fbtrace.conf -user *** -pass ***
